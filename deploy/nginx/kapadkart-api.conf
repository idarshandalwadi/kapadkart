# Paste these location blocks inside the existing server { } on the EC2 nginx.
# Same paths as the other KapadKart locations already on that server.
# Do not add a new server { }.
#
# This repo is one Node process. Shop and admin both proxy to it.
# App port is 4000 (PORT in kapadkart/.env). Keep 4000 closed in the
# EC2 security group.
#
#   http://13.234.170.148/kapadkart/api/health           ->  /api/v1/health
#   http://13.234.170.148/kapadkart_admin/api/health    ->  /api/v1/health
#   http://13.234.170.148/kapadkart/uploads/<file>      ->  /uploads/<file>
#
# The apps call /api/... . Express serves /api/v1/... . The rewrite adds v1,
# same as the Vite dev proxy. A request that already includes /api/v1/ is left as-is.
#
# Public base for image URLs (BASE_URL and both VITE_API_BASE_URL values):
#   http://13.234.170.148/kapadkart
# Admin can use the same base. /kapadkart_admin/api/ is only needed if the
# admin build calls http://13.234.170.148/kapadkart_admin .

location /kapadkart/api/ {
    client_max_body_size 12m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    rewrite ^/kapadkart/api/v1/(.*)$ /api/v1/$1 break;
    rewrite ^/kapadkart/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

location /kapadkart/uploads/ {
    rewrite ^/kapadkart/uploads/(.*)$ /uploads/$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
}

location /kapadkart/images/ {
    rewrite ^/kapadkart/images/(.*)$ /images/$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kapadkart {
    return 301 /kapadkart/;
}

location /kapadkart_admin/api/ {
    client_max_body_size 12m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    rewrite ^/kapadkart_admin/api/v1/(.*)$ /api/v1/$1 break;
    rewrite ^/kapadkart_admin/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
