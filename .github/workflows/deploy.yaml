name: Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            pm2 jlist > /tmp/kapadkart-pm2.json
            APP_DIR=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/kapadkart-pm2.json","utf8")).find(a=>a.name==="kapadkart-api").pm2_env.pm_cwd')
            echo "Deploying in $APP_DIR"
            cd "$APP_DIR"
            if [ ! -d .git ]; then
              echo "ERROR: $APP_DIR is not a git clone."
              echo "On the server, from that directory, run:"
              echo "  git init && git remote add origin git@github.com:YOUR_USER/kapadkart.git && git fetch origin && git checkout -f main"
              exit 1
            fi
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm ci
            npx prisma generate
            npm run db:migrate
            pm2 restart kapadkart-api --update-env
            pm2 save
