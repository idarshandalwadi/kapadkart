name: Deploy API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/kapadkart
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            npm ci
            npx prisma generate
            npm run db:migrate
            pm2 restart kapadkart-api --update-env
            pm2 save
